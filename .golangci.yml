run:
  timeout: 5m
  go: "1.24"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - nolintlint
    - unconvert
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters: [errcheck]
    - path: "internal/sibylproxy/stub\\.go"
      linters: [errcheck, unused]
  max-issues-per-linter: 0
  max-same-issues: 0
