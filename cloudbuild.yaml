# cloudbuild.yaml — builds and deploys gitlab-sentinel to Cloud Run.
#
# Usage (one-time setup):
#   gcloud auth login
#   gcloud config set project YOUR_PROJECT_ID
#
# Deploy:
#   gcloud builds submit --config cloudbuild.yaml .
#
# Or trigger automatically via Cloud Build trigger on main branch push.

substitutions:
  _SERVICE: gitlab-sentinel
  _REGION: us-central1
  _IMAGE: gcr.io/$PROJECT_ID/gitlab-sentinel

steps:
  # 1. Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=$_IMAGE:$COMMIT_SHA
      - --tag=$_IMAGE:latest
      - --cache-from=$_IMAGE:latest
      - .

  # 2. Push to Container Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_IMAGE

  # 3. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_IMAGE:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --timeout=300
      # Secrets injected at deploy time — set these in Cloud Run console
      # or via: gcloud run services update gitlab-sentinel \
      #   --update-secrets=GITLAB_TOKEN=gitlab-token:latest \
      #   --update-secrets=GOOGLE_API_KEY=google-api-key:latest
      - --set-env-vars=LLM_BACKEND=gemini

images:
  - $_IMAGE:$COMMIT_SHA
  - $_IMAGE:latest
