<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GitLab Sentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<script src="/config.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
/* ── tokens ── */
:root {
  --bg:        #0d0e11;
  --bg-1:      #13151a;
  --bg-2:      #1a1d24;
  --bg-3:      #21252f;
  --line:      #2a2d36;
  --line-2:    #363a47;
  --ink:       #e2e4ed;
  --ink-2:     #9399aa;
  --ink-3:     #5a5f6e;
  --gl:        #fc6d26;   /* GitLab orange */
  --gl-dim:    rgba(252,109,38,.12);
  --gl-glow:   rgba(252,109,38,.25);
  --purple:    #7c5cbf;   /* researcher */
  --teal:      #2dbe8e;   /* critic / accepted */
  --red:       #e5534b;   /* rejected / critical */
  --yellow:    #d4a72c;   /* medium */
  --blue:      #4d9cf6;   /* running / temporal */
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--ink);
  font-family: var(--mono); font-size: 13px; line-height: 1.5;
  height: 100%; overflow: hidden;
}
body {
  background:
    radial-gradient(ellipse 60% 40% at 0% 0%, rgba(252,109,38,.04) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 100% 100%, rgba(124,92,191,.05) 0%, transparent 60%),
    var(--bg);
}
#root { height: 100vh; }

/* ── layout ── */
.app { display: grid; grid-template-rows: 52px 1fr; height: 100vh; }

/* ── header ── */
header {
  border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; padding: 0 20px; gap: 24px;
  background: rgba(13,14,17,.92); backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-logo {
  width: 26px; height: 26px; flex-shrink: 0;
}
.brand-name {
  font-family: var(--sans); font-weight: 600; font-size: 15px;
  color: var(--ink); letter-spacing: -.3px;
}
.brand-name span { color: var(--gl); }
.brand-tag {
  font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3); padding: 2px 7px; border: 1px solid var(--line-2);
}

.nav { display: flex; gap: 2px; }
.nav-btn {
  background: transparent; border: none; color: var(--ink-2);
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; padding: 6px 14px; cursor: pointer;
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
}
.nav-btn:hover { color: var(--ink); }
.nav-btn.active { color: var(--gl); border-bottom-color: var(--gl); }
.nav-badge {
  margin-left: 5px; padding: 1px 5px; font-size: 9px;
  background: var(--bg-2); border: 1px solid var(--line-2); color: var(--ink-3);
}
.nav-btn.active .nav-badge { color: var(--gl); border-color: var(--gl); }

.hd-right { display: flex; align-items: center; gap: 10px; }
.status-pill {
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-3); padding: 4px 10px; border: 1px solid var(--line-2);
}
.status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.status-pill.live { color: var(--teal); border-color: var(--teal); }
.status-pill.live .dot { background: var(--teal); animation: pulse 1.6s ease-out infinite; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(45,190,142,.6); }
  70%  { box-shadow: 0 0 0 6px rgba(45,190,142,0); }
  100% { box-shadow: 0 0 0 0 rgba(45,190,142,0); }
}

.btn {
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; padding: 6px 14px; cursor: pointer;
  background: var(--bg-2); color: var(--ink-2); border: 1px solid var(--line-2);
  transition: color .15s, border-color .15s;
}
.btn:hover { color: var(--ink); border-color: var(--ink-2); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-run {
  background: var(--gl); color: #fff; border-color: var(--gl); font-weight: 600;
  position: relative; overflow: hidden;
}
.btn-run:hover { background: #ff8247; border-color: #ff8247; color: #fff; }
.btn-run:disabled { background: var(--bg-2); color: var(--ink-3); border-color: var(--line-2); }
.btn-run.running::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.15) 50%, transparent 100%);
  animation: shimmer 1.4s linear infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

main { overflow: hidden; position: relative; }
.panel { position: absolute; inset: 0; visibility: hidden; pointer-events: none; opacity: 0; }
.panel.active { visibility: visible; pointer-events: auto; opacity: 1; }

/* ── config bar (project input) ── */
.config-bar {
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid var(--line);
  background: var(--bg-1); padding: 0 20px;
  height: 40px; flex-shrink: 0;
}
.config-label {
  font-size: 9px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-3); margin-right: 10px; white-space: nowrap;
}
.config-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  padding: 0; max-width: 320px;
}
.config-input::placeholder { color: var(--ink-3); }
.config-sep { width: 1px; height: 20px; background: var(--line-2); margin: 0 16px; }
.config-backend {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--teal); display: flex; align-items: center; gap: 6px;
}
.config-backend .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); }

/* ── list view ── */
.list-layout { display: grid; grid-template-rows: 40px 1fr; height: 100%; }
.list-body { display: grid; grid-template-columns: 300px 1fr; height: 100%; overflow: hidden; }

/* sidebar */
.sidebar { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 16px; }
.sidebar-section { margin-bottom: 20px; }
.sidebar-label {
  font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 10px; display: block;
}
.scanner-tile {
  border: 1px solid var(--line); background: var(--bg-1); margin-bottom: 8px;
  transition: border-color .2s;
}
.scanner-tile.running  { border-color: var(--gl); }
.scanner-tile.completed { border-color: var(--teal); }
.scanner-tile.failed   { border-color: var(--red); }
.scanner-tile-head {
  padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--line);
}
.scanner-tile-name { font-size: 11px; font-weight: 500; }
.scanner-tile-status {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
}
.scanner-tile.running  .scanner-tile-status { color: var(--gl); }
.scanner-tile.completed .scanner-tile-status { color: var(--teal); }
.scanner-tile-body { padding: 7px 10px 9px; font-size: 10px; color: var(--ink-2); }
.scanner-tile-body .row { display: flex; justify-content: space-between; }
.scanner-tile-body .row b { color: var(--ink); }

.source-chip {
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid var(--line); padding: 6px 10px; margin-bottom: 6px;
  font-size: 10px;
}
.source-chip-name { font-weight: 500; }
.source-chip-tag {
  font-size: 8px; letter-spacing: .12em; text-transform: uppercase;
  padding: 2px 6px; border: 1px solid;
}
.source-chip-tag.live { color: var(--teal); border-color: var(--teal); }
.source-chip-tag.mock { color: var(--ink-3); border-color: var(--line-2); }

/* stream area */
.stream-area { display: grid; grid-template-rows: 1fr 1fr; overflow: hidden; }
.stream-pane { display: flex; flex-direction: column; overflow: hidden; }
.stream-pane + .stream-pane { border-top: 1px solid var(--line); }
.pane-head {
  padding: 8px 16px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg-1); flex-shrink: 0;
}
.pane-title { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
.pane-count { font-family: var(--sans); font-size: 18px; color: var(--gl); font-weight: 600; }
.pane-scroll { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }

/* workflow banner */
.wf-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 16px; border-bottom: 1px solid var(--line);
  background: var(--bg-1); font-size: 10px; flex-shrink: 0;
}
.wf-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; }
.wf-dot.running { background: var(--blue); animation: pulse2 1.4s ease-out infinite; }
.wf-dot.completed { background: var(--teal); }
.wf-dot.failed { background: var(--red); }
@keyframes pulse2 {
  0%   { box-shadow: 0 0 0 0 rgba(77,156,246,.6); }
  70%  { box-shadow: 0 0 0 5px rgba(77,156,246,0); }
  100% { box-shadow: 0 0 0 0 rgba(77,156,246,0); }
}
.wf-label { color: var(--ink-3); margin-right: 4px; }
.wf-id { color: var(--ink); }
.wf-id a { color: var(--blue); text-decoration: none; border-bottom: 1px dotted var(--blue); cursor: pointer; }
.wf-state { margin-left: auto; letter-spacing: .12em; text-transform: uppercase; font-size: 9px; }
.wf-state.running { color: var(--blue); }
.wf-state.completed { color: var(--teal); }
.wf-state.failed { color: var(--red); }
.wf-state.idle { color: var(--ink-3); }

/* event row */
.ev-row {
  display: grid; grid-template-columns: 60px 100px 1fr;
  gap: 8px; align-items: baseline; padding: 3px 0;
  font-size: 10px; border-bottom: 1px solid rgba(42,45,54,.4);
  animation: slideIn .25s ease-out both;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; } }
.ev-ts { color: var(--ink-3); }
.ev-kind {
  font-size: 8px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 5px; border: 1px solid var(--line-2); text-align: center; white-space: nowrap;
}
.ev-kind.node-started    { color: var(--gl);   border-color: var(--gl);   }
.ev-kind.node-completed  { color: var(--teal); border-color: var(--teal); }
.ev-kind.node-failed     { color: var(--ink-2);border-color: var(--line-2);}
.ev-kind.workflow-started    { color: var(--blue); border-color: var(--blue); }
.ev-kind.workflow-completed  { color: var(--teal); border-color: var(--teal); }
.ev-kind.workflow-failed     { color: var(--red);  border-color: var(--red);  }
.ev-msg { color: var(--ink-2); }
.ev-msg b { color: var(--ink); font-weight: 500; }
.ev-msg .mono { color: var(--gl); }

/* ── finding card ── */
.finding-card {
  border: 1px solid var(--line); border-left: 3px solid var(--gl);
  background: var(--bg-1); margin-bottom: 10px;
  animation: cardIn .35s ease-out both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
.finding-card.sev-CRITICAL { border-left-color: var(--red); }
.finding-card.sev-HIGH     { border-left-color: var(--gl); }
.finding-card.sev-MEDIUM   { border-left-color: var(--yellow); }
.finding-card.rejected     { border-left-color: var(--ink-3); opacity: .65; }

.fc-head {
  padding: 10px 12px 8px; display: flex; justify-content: space-between;
  align-items: flex-start; gap: 10px;
}
.fc-title { font-size: 12px; font-weight: 500; flex: 1; line-height: 1.4; color: var(--ink); }
.finding-card.rejected .fc-title { text-decoration: line-through; color: var(--ink-3); }
.fc-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.fc-sev {
  font-size: 8px; letter-spacing: .15em; text-transform: uppercase; font-weight: 700;
}
.fc-sev.CRITICAL { color: var(--red); }
.fc-sev.HIGH     { color: var(--gl); }
.fc-sev.MEDIUM   { color: var(--yellow); }
.fc-sev.REJECTED { color: var(--ink-3); }

.tmp-btn {
  font-size: 8px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
  color: var(--blue); border: 1px solid var(--blue); padding: 3px 7px;
  cursor: pointer; text-decoration: none; background: transparent;
}
.tmp-btn:hover { background: var(--blue); color: var(--bg); }

.fc-desc {
  padding: 0 12px 8px; font-size: 11px; color: var(--ink-2); line-height: 1.6;
  max-height: 100px; overflow-y: auto;
}

/* debate transcript — the signature element */
.debate {
  margin: 0 12px 10px; border: 1px solid var(--line-2); background: var(--bg);
}
.debate-header {
  padding: 5px 10px; border-bottom: 1px solid var(--line-2);
  display: flex; align-items: center; gap: 8px;
  font-size: 9px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3);
}
.debate-header .icon { font-size: 11px; }
.debate-turn {
  padding: 8px 10px; border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 80px 1fr; gap: 8px;
}
.debate-turn:last-child { border-bottom: none; }
.debate-role {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  font-weight: 600; padding-top: 1px; white-space: nowrap;
}
.debate-role.researcher { color: var(--purple); }
.debate-role.critic     { color: var(--teal); }
.debate-role.verdict    { color: var(--gl); }
.debate-text { font-size: 11px; color: var(--ink-2); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.debate-text b { color: var(--ink); font-weight: 500; }

.fc-meta {
  padding: 6px 12px 8px; display: flex; gap: 14px; flex-wrap: wrap;
  font-size: 9px; color: var(--ink-3); border-top: 1px solid var(--line);
}
.fc-meta b { color: var(--ink-2); }

/* empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 12px; color: var(--ink-3); text-align: center;
}
.empty-state .big { font-family: var(--sans); font-size: 28px; color: var(--line-2); }
.empty-state .hint { font-size: 11px; line-height: 1.7; max-width: 320px; }
.empty-state .hint b { color: var(--ink-2); }
.empty-state .kbd {
  display: inline-block; padding: 2px 7px; border: 1px solid var(--line-2);
  color: var(--ink-2); font-size: 10px; margin: 0 2px;
}

/* rejected divider */
.rejected-divider {
  margin: 14px 0 8px; padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3);
}

/* ── DAG view ── */
.dag-layout { display: grid; grid-template-rows: 40px 44px 1fr; height: 100%; }
.dag-toolbar {
  padding: 0 20px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg-1);
}
.dag-stats { display: flex; gap: 20px; }
.dag-stat { font-size: 11px; color: var(--ink-2); display: flex; align-items: baseline; gap: 4px; }
.dag-stat .n { font-family: var(--sans); font-size: 17px; color: var(--gl); font-weight: 600; line-height: 1; }
.dag-stat .n.ok  { color: var(--teal); }
.dag-stat .n.bad { color: var(--red); }
.dag-stat .n.run { color: var(--blue); }
.dag-legend { display: flex; gap: 12px; font-size: 9px; color: var(--ink-3); }
.dag-legend .sw { display: flex; align-items: center; gap: 4px; }
.dag-legend .dot { width: 7px; height: 7px; border-radius: 1px; }
.dag-legend .dot.idle    { background: var(--line-2); }
.dag-legend .dot.running { background: var(--gl); animation: blink .9s ease-in-out infinite alternate; }
.dag-legend .dot.done    { background: var(--teal); }
.dag-legend .dot.rej     { background: var(--ink-3); }
@keyframes blink { from { opacity: .4; } to { opacity: 1; } }

.dag-zoom {
  display: flex; align-items: center; gap: 4px; margin-left: 14px;
  padding-left: 14px; border-left: 1px solid var(--line);
}
.zoom-btn {
  width: 24px; height: 24px; background: var(--bg); border: 1px solid var(--line-2);
  color: var(--ink-2); font-family: var(--mono); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.zoom-btn:hover { color: var(--gl); border-color: var(--gl); }
.zoom-val { font-size: 9px; color: var(--ink-3); min-width: 36px; text-align: center; }

.phase-bar {
  padding: 0 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 0; overflow-x: auto;
  scrollbar-width: none;
}
.phase-seg {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px 0 0; font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); border-right: 1px solid var(--line); margin-right: 16px;
  white-space: nowrap;
}
.phase-seg:last-child { border-right: none; }
.phase-seg.active { color: var(--gl); }
.phase-seg.done   { color: var(--teal); }
.phase-seg .ph-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.phase-seg.active .ph-dot { animation: pulse 1.4s ease-out infinite; }

.dag-canvas {
  overflow: auto; position: relative;
  background:
    linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px) 0 0 / 36px 36px,
    linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px) 0 0 / 36px 36px;
}
.dag-zoom-wrap { transform-origin: 0 0; will-change: transform; }

/* SVG node styles */
.node-g { cursor: pointer; }
.node-g rect { transition: stroke .2s, fill .2s; stroke-width: 1.5; }
.node-g:hover rect { filter: brightness(1.3); }
.node-g.idle rect     { fill: var(--bg-1); stroke: var(--line-2); }
.node-g.running rect  { fill: var(--bg-2); stroke: var(--gl); }
.node-g.completed rect, .node-g.accepted rect { fill: var(--bg-1); stroke: var(--teal); }
.node-g.accepted rect { fill: rgba(45,190,142,.04); }
.node-g.rejected rect, .node-g.failed rect { fill: var(--bg-1); stroke: var(--ink-3); }
.node-g.root rect     { fill: var(--bg-2); stroke: var(--gl); }

.node-pulse { fill: none; stroke: var(--gl); stroke-width: 2; opacity: 0; pointer-events: none; }
.node-g.running .node-pulse { animation: ring 1.3s ease-out infinite; }
@keyframes ring {
  0%   { stroke-opacity: .6; transform: scale(1);    transform-box: fill-box; transform-origin: center; }
  100% { stroke-opacity: 0;  transform: scale(1.16); transform-box: fill-box; transform-origin: center; }
}

.node-g .lbl { fill: var(--ink); font-family: var(--mono); font-size: 11px; font-weight: 500; pointer-events: none; }
.node-g.root .lbl { fill: var(--gl); }
.node-g.rejected .lbl, .node-g.failed .lbl { fill: var(--ink-3); }
.node-g .sub { fill: var(--ink-3); font-family: var(--mono); font-size: 9px; pointer-events: none; }
.node-g .badge { fill: var(--ink-3); font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .08em; pointer-events: none; }
.node-g.running .badge  { fill: var(--gl); }
.node-g.completed .badge, .node-g.accepted .badge { fill: var(--teal); }
.node-g .sev-label { font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .1em; pointer-events: none; }
.node-g .sev-label.CRITICAL { fill: var(--red); }
.node-g .sev-label.HIGH     { fill: var(--gl); }
.node-g .sev-label.MEDIUM   { fill: var(--yellow); }

.edge-base { stroke: var(--line-2); stroke-width: 1.5; fill: none; }
.edge-active { stroke: var(--gl); stroke-width: 2; fill: none; stroke-dasharray: 5 4; animation: dash .5s linear infinite; }
.edge-done   { stroke: var(--teal); stroke-width: 1.5; fill: none; opacity: .5; }
.edge-rej    { stroke: var(--ink-3); stroke-width: 1; fill: none; opacity: .4; stroke-dasharray: 3 3; }
@keyframes dash { to { stroke-dashoffset: -9; } }

/* synth tile */
.synth-accept rect { fill: var(--bg-1); stroke: var(--teal); stroke-width: 1.5; }
.synth-reject rect { fill: var(--bg-1); stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }

/* notes icon */
.notes-icon { fill: var(--ink-3); cursor: pointer; transition: fill .15s; }
.notes-icon:hover, .notes-icon-bg:hover ~ .notes-icon { fill: var(--gl); }
.notes-icon-bg { fill: transparent; stroke: var(--line-2); stroke-width: 1; cursor: pointer; }
.notes-icon-bg:hover { stroke: var(--gl); }

/* ── popover ── */
.pop-overlay { position: fixed; inset: 0; z-index: 99; }
.popover {
  position: fixed; z-index: 100;
  background: var(--bg-1); border: 1px solid var(--gl);
  box-shadow: 0 12px 40px rgba(0,0,0,.7), 0 0 0 1px var(--gl-dim);
  padding: 0; min-width: 360px; max-width: 560px; max-height: calc(100vh - 80px);
  overflow: hidden; display: flex; flex-direction: column;
  animation: popIn .18s ease-out;
}
@keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(-4px); } to { opacity: 1; } }
.pop-head {
  padding: 12px 14px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  flex-shrink: 0;
}
.pop-title { font-size: 11px; font-weight: 500; flex: 1; line-height: 1.4; word-break: break-word; }
.pop-close {
  background: none; border: none; color: var(--ink-3); font-size: 18px;
  cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
}
.pop-close:hover { color: var(--ink); }
.pop-body { overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.pop-field { display: flex; flex-direction: column; gap: 4px; }
.pop-field-label {
  font-size: 8px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3);
}
.pop-field-val { font-size: 11px; color: var(--ink-2); line-height: 1.5; word-break: break-word; }
.pop-field-val.rationale {
  background: var(--bg); padding: 8px 10px;
  border-left: 2px solid var(--purple);
  color: var(--ink); line-height: 1.55; white-space: pre-wrap;
  max-height: 260px; overflow-y: auto;
}
.pop-field-val.critic {
  background: var(--bg); padding: 8px 10px;
  border-left: 2px solid var(--teal);
  color: var(--ink); line-height: 1.55; white-space: pre-wrap;
  max-height: 260px; overflow-y: auto;
}
.pop-field-val.reason {
  background: var(--bg); padding: 8px 10px;
  border-left: 2px solid var(--red);
  color: var(--ink-2); line-height: 1.55; white-space: pre-wrap;
  max-height: 200px; overflow-y: auto;
}
.pop-field-val.json {
  background: var(--bg); padding: 8px 10px;
  border-left: 2px solid var(--line-2);
  color: var(--ink-2); font-size: 10px; line-height: 1.5;
  white-space: pre; overflow: auto; max-height: 200px;
}
.pop-field-val.sev-CRITICAL { color: var(--red); font-weight: 700; }
.pop-field-val.sev-HIGH     { color: var(--gl);  font-weight: 700; }
.pop-field-val.sev-MEDIUM   { color: var(--yellow); font-weight: 700; }
.pop-foot {
  padding: 10px 14px; border-top: 1px solid var(--line);
  display: flex; justify-content: flex-end; flex-shrink: 0;
}
details summary {
  cursor: pointer; outline: none; user-select: none;
  font-size: 8px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3);
}
details summary:hover { color: var(--blue); }
details[open] summary { color: var(--blue); }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: '▸ '; }
details[open] summary::before { content: '▾ '; }

/* wide synthesis popover */
.popover.wide { min-width: 580px; max-width: 700px; }
.synth-list { display: flex; flex-direction: column; gap: 8px; }
.synth-item {
  border: 1px solid var(--line); border-left: 3px solid var(--gl);
  background: var(--bg); padding: 9px 11px;
}
.synth-item.sev-CRITICAL { border-left-color: var(--red); }
.synth-item.sev-HIGH     { border-left-color: var(--gl); }
.synth-item.sev-MEDIUM   { border-left-color: var(--yellow); }
.synth-item.rejected     { border-left-color: var(--ink-3); opacity: .8; }
.synth-item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.synth-item-title { font-size: 11px; font-weight: 500; flex: 1; }
.synth-item-body { font-size: 10px; color: var(--ink-2); margin-bottom: 6px; }
.synth-item-debate { margin-bottom: 6px; }
.synth-item-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px solid var(--line); }
.synth-item-meta { display: flex; gap: 10px; font-size: 9px; color: var(--ink-3); }
.synth-item-meta b { color: var(--ink-2); }

/* empty dag */
.dag-empty { fill: var(--ink-3); font-family: 'IBM Plex Sans', sans-serif; font-style: italic; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const TEMPORAL_BASE = (window.SENTRY_CONFIG && window.SENTRY_CONFIG.temporal_ui_base)
  || 'http://localhost:8233/namespaces/default/workflows/';

const SCANNERS = [
  { id: 'gitlab',   label: 'GitLab',         sub: 'blob search · MR diffs', live: true },
  { id: 'secrets',  label: 'Secrets',         sub: 'regex · git history',    live: false },
  { id: 'oauth',    label: 'Stale OAuth',     sub: 'okta :9001 mock',        live: false },
  { id: 'scopes',   label: 'Over-Privilege',  sub: 'okta :9001 mock',        live: false },
  { id: 'dormancy', label: 'Dormant IAM',     sub: 'aws :9002 mock',         live: false },
];

/* ── helpers ── */
function labelFor(id) { const s = SCANNERS.find(x => x.id === id); return s ? s.label : id; }
function childWfID(parentWfID, candidateID) {
  if (!parentWfID || !candidateID) return '';
  const short = parentWfID.replace(/^sentry-audit-/, '');
  const safe = candidateID.length > 60 ? candidateID.slice(0, 60) : candidateID;
  return `converge-${short}-${safe}`;
}
function inferParent(cid) {
  if (cid.startsWith('gl-')) return 'gitlab';
  if (cid.startsWith('stale-oauth-') || cid.startsWith('oauth-')) return 'oauth';
  if (cid.startsWith('over-priv-') || cid.startsWith('overpriv-')) return 'scopes';
  if (cid.startsWith('dormant-iam-') || cid.startsWith('dorm-')) return 'dormancy';
  return 'secrets';
}

/* Parse a rationale string that may contain labelled sections.
   Returns { sections: [{ role, text }] } for the debate view. */
function parseRationale(raw) {
  if (!raw) return null;
  // Try to split on structured labels like RESEARCHER:, CRITIC:, VERDICT:, ROUND N:
  const sectionRe = /\b(RESEARCHER|CRITIC|VERDICT|ROUND\s+\d+|DECISION|RATIONALE|SEVERITY|REVISED_DESCRIPTION)\s*[:\-]\s*/gi;
  const parts = raw.split(sectionRe).filter(Boolean);
  if (parts.length < 3) return null; // no structure found
  const turns = [];
  for (let i = 0; i < parts.length - 1; i += 2) {
    const role = parts[i].trim().toLowerCase().replace(/\s+\d+$/, '');
    const text = (parts[i + 1] || '').trim();
    if (text) turns.push({ role, text });
  }
  return turns.length > 0 ? turns : null;
}

/* ── App ── */
function App() {
  const [tab, setTab] = useState('dag');
  const [playState, setPlayState] = useState('idle');
  const [workflowId, setWorkflowId] = useState(null);
  const [scanner, setScanner] = useState(() => Object.fromEntries(SCANNERS.map(s => [s.id, 'idle'])));
  const [scannerOut, setScannerOut] = useState({});
  const [candidates, setCandidates] = useState({});
  const [events, setEvents] = useState([]);
  const [findings, setFindings] = useState([]);
  const [rejected, setRejected] = useState([]);
  const esRef = useRef(null);
  const [project, setProject] = useState('');

  const reset = useCallback(() => {
    if (esRef.current) { esRef.current.close(); esRef.current = null; }
    setPlayState('idle'); setWorkflowId(null);
    setScanner(Object.fromEntries(SCANNERS.map(s => [s.id, 'idle'])));
    setScannerOut({}); setCandidates({}); setEvents([]);
    setFindings([]); setRejected([]);
  }, []);

  const appendEv = useCallback((e) => {
    setEvents(prev => [{ ...e, key: Date.now() + '-' + Math.random() }, ...prev].slice(0, 300));
  }, []);

  async function runAudit() {
    reset();
    setPlayState('running');
    let wfId = null;
    try {
      const resp = await fetch('/run', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gitlab_project: project || undefined }),
      });
      if (!resp.ok) { appendEv({ kind: 'error', label: 'error', msg: 'run failed: ' + resp.statusText }); setPlayState('idle'); return; }
      wfId = (await resp.json()).workflow_id;
      setWorkflowId(wfId);
    } catch(e) { appendEv({ kind: 'error', label: 'error', msg: String(e) }); setPlayState('idle'); return; }

    const es = new EventSource('/events?workflow_id=' + encodeURIComponent(wfId));
    esRef.current = es;
    const handle = (m) => { try { handleEvent(JSON.parse(m.data), wfId); } catch(e) { console.warn(e); } };
    es.onmessage = handle;
    ['workflow.started','workflow.completed','workflow.failed','node.started','node.completed','node.failed']
      .forEach(k => es.addEventListener(k, handle));
    es.onerror = () => { es.close(); esRef.current = null; };
  }

  function handleEvent(raw, wfId) {
    const ev = { kind: raw.kind, ...(raw.payload || {}) };
    const ts = new Date().toLocaleTimeString([], { hour12: false });
    switch (ev.kind) {
      case 'workflow.started':
        appendEv({ kind: 'workflow-started', label: 'wf.start', msg: `audit started`, ts });
        break;
      case 'workflow.completed':
        setPlayState('done');
        appendEv({ kind: 'workflow-completed', label: 'wf.done', msg: `audit complete in ${(ev.duration_ms/1000).toFixed(1)}s`, ts });
        fetchReport(ev.workflow_id || wfId);
        break;
      case 'workflow.failed':
        setPlayState('done');
        appendEv({ kind: 'workflow-failed', label: 'wf.fail', msg: `failed: ${ev.error || ''}`, ts });
        break;
      case 'node.started': {
        const nid = ev.node_id || '';
        if (nid.startsWith('converge:')) {
          const cid = nid.slice('converge:'.length);
          setCandidates(p => ({ ...p, [cid]: { status: 'running', label: ev.label || cid, convergeWorkflowID: childWfID(wfId, cid) } }));
          appendEv({ kind: 'node-started', label: 'converge', msg: <><span className="mono">{cid}</span> → researcher/critic</>, ts });
        } else {
          setScanner(p => ({ ...p, [nid]: 'running' }));
          appendEv({ kind: 'node-started', label: 'scanner', msg: <><b>{labelFor(nid)}</b> scanning…</>, ts });
        }
        break;
      }
      case 'node.completed': {
        const nid = ev.node_id || '';
        if (nid.startsWith('converge:')) {
          const cid = nid.slice('converge:'.length);
          const out = ev.output || {};
          setCandidates(p => ({ ...p, [cid]: {
            status: 'accepted', label: ev.label || cid,
            severity: out.severity, rounds: out.rounds || 0,
            convergeWorkflowID: out.converge_workflow_id || childWfID(wfId, cid),
            rationale: out.rationale || '', description: out.description || '',
          }}));
          appendEv({ kind: 'node-completed', label: 'accepted', msg: <><span className="mono">{cid}</span> accepted · <b>{out.severity}</b> · {out.rounds}R</>, ts });
        } else {
          setScanner(p => ({ ...p, [nid]: 'completed' }));
          setScannerOut(p => ({ ...p, [nid]: ev.output }));
          appendEv({ kind: 'node-completed', label: 'scanner', msg: <><b>{labelFor(nid)}</b> done ({(ev.duration_ms/1000).toFixed(2)}s)</>, ts });
        }
        break;
      }
      case 'node.failed': {
        const nid = ev.node_id || '';
        if (nid.startsWith('converge:')) {
          const cid = nid.slice('converge:'.length);
          setCandidates(p => ({ ...p, [cid]: {
            status: 'rejected', label: ev.label || cid, rounds: 0,
            reason: ev.error || '',
            convergeWorkflowID: (p[cid] && p[cid].convergeWorkflowID) || childWfID(wfId, cid),
          }}));
          appendEv({ kind: 'node-failed', label: 'rejected', msg: <><span className="mono">{cid}</span> rejected</>, ts });
        } else {
          setScanner(p => ({ ...p, [nid]: 'failed' }));
          appendEv({ kind: 'node-failed', label: 'scanner', msg: <><b>{labelFor(nid)}</b> failed</>, ts });
        }
        break;
      }
    }
  }

  async function fetchReport(wfId) {
    if (!wfId) return;
    try {
      const r = await fetch('/report?workflow_id=' + encodeURIComponent(wfId));
      if (!r.ok) return;
      const out = await r.json();
      const rep = out.Report || out.report || {};
      setFindings(rep.Findings || rep.findings || []);
      setRejected(rep.Rejected || rep.rejected || []);
    } catch(e) { console.error(e); }
  }

  useEffect(() => () => { if (esRef.current) esRef.current.close(); }, []);

  const candsByParent = useMemo(() => {
    const out = Object.fromEntries(SCANNERS.map(s => [s.id, []]));
    Object.entries(candidates).forEach(([cid, c]) => {
      const p = inferParent(cid);
      if (out[p]) out[p].push({ id: cid, ...c });
    });
    return out;
  }, [candidates]);

  const accepted  = useMemo(() => Object.values(candidates).filter(c => c.status === 'accepted').length, [candidates]);
  const rejCount  = useMemo(() => Object.values(candidates).filter(c => c.status === 'rejected').length, [candidates]);
  const running   = useMemo(() => Object.values(candidates).filter(c => c.status === 'running').length, [candidates]);

  const openTemporal = (id) => id && window.open(TEMPORAL_BASE + id, '_blank');

  const phaseStatus = useMemo(() => {
    const vals = Object.values(scanner);
    const p1 = vals.every(v => v === 'idle') ? 'idle' : vals.every(v => v === 'completed' || v === 'failed') ? 'done' : 'active';
    const p2 = Object.keys(candidates).length === 0 ? 'idle' : running > 0 ? 'active' : 'done';
    const p3 = playState === 'done' ? 'done' : 'idle';
    return [p1, p2, p3];
  }, [scanner, candidates, running, playState]);

  const isRunning = playState === 'running';
  const isDone    = playState === 'done';

  return (
    <div className="app">
      <header>
        <div className="brand">
          {/* GitLab fox logo SVG */}
          <svg className="brand-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 29L6.4 17.6L2 8L6.4 17.6L16 29Z" fill="#fc6d26"/>
            <path d="M16 29L25.6 17.6L30 8L25.6 17.6L16 29Z" fill="#fc6d26"/>
            <path d="M16 29L25.6 17.6L16 5L6.4 17.6L16 29Z" fill="#e24329"/>
            <path d="M6.4 17.6L2 8L9.6 8L6.4 17.6Z" fill="#fca326"/>
            <path d="M25.6 17.6L30 8L22.4 8L25.6 17.6Z" fill="#fca326"/>
            <path d="M9.6 8L16 5L6.4 17.6L9.6 8Z" fill="#e24329"/>
            <path d="M22.4 8L16 5L25.6 17.6L22.4 8Z" fill="#e24329"/>
          </svg>
          <span className="brand-name">GitLab <span>Sentinel</span></span>
          <span className="brand-tag">Hackathon</span>
        </div>

        <div className="nav">
          <button className={"nav-btn " + (tab === 'dag' ? 'active' : '')} onClick={() => setTab('dag')}>
            DAG <span className="nav-badge">{Object.keys(candidates).length + SCANNERS.length + 1}</span>
          </button>
          <button className={"nav-btn " + (tab === 'list' ? 'active' : '')} onClick={() => setTab('list')}>
            Findings <span className="nav-badge">{findings.length}</span>
          </button>
        </div>

        <div className="hd-right">
          <div className={"status-pill " + (isRunning ? 'live' : '')}>
            <span className="dot"/>
            {isRunning ? 'live' : isDone ? 'done' : 'idle'}
          </div>
          <button className="btn" onClick={reset} disabled={!isRunning && !isDone}>Reset</button>
          <button className={"btn btn-run " + (isRunning ? 'running' : '')} onClick={runAudit} disabled={isRunning}>
            {isDone ? 'Run Again' : isRunning ? 'Scanning…' : 'Run Audit'}
          </button>
        </div>
      </header>

      <main>
        <div className={"panel " + (tab === 'dag' ? 'active' : '')}>
          <DagView
            scanner={scanner} scannerOut={scannerOut}
            candidates={candidates} candsByParent={candsByParent}
            workflowId={workflowId} playState={playState}
            accepted={accepted} rejCount={rejCount} running={running}
            phaseStatus={phaseStatus}
            findings={findings} rejected={rejected}
            openTemporal={openTemporal}
            project={project} onProjectChange={setProject}
          />
        </div>
        <div className={"panel " + (tab === 'list' ? 'active' : '')}>
          <ListView
            scanner={scanner} scannerOut={scannerOut}
            events={events} workflowId={workflowId} playState={playState}
            findings={findings} rejected={rejected}
            openTemporal={openTemporal}
            project={project} onProjectChange={setProject}
          />
        </div>
      </main>
    </div>
  );
}

/* ── Finding Card (shared by list + popover) ── */
function FindingCard({ f, isRejected, reason, convergeID, openTemporal }) {
  const sev       = f.severity || f.Severity || 'INFO';
  const title     = f.title || f.Title || '(no title)';
  const desc      = f.description || f.Description || '';
  const rationale = f.llm_rationale || f.LLMRationale || '';
  const scanner   = f.scanner_id || f.ScannerID || '';
  const rounds    = f.converge_rounds || f.ConvergeRounds || 0;
  const cwfid     = isRejected ? (convergeID || '') : (f.converge_workflow_id || f.ConvergeWorkflowID || '');

  const debate = parseRationale(rationale || reason || '');

  return (
    <div className={"finding-card " + (isRejected ? 'rejected' : 'sev-' + sev)}>
      <div className="fc-head">
        <div className="fc-title">{title}</div>
        <div className="fc-right">
          {cwfid && <a className="tmp-btn" onClick={() => openTemporal(cwfid)}>TMP →</a>}
          <span className={"fc-sev " + (isRejected ? 'REJECTED' : sev)}>{isRejected ? 'REJECTED' : sev}</span>
        </div>
      </div>
      {desc && <div className="fc-desc">{desc}</div>}

      <div className="debate">
        <div className="debate-header">
          <span className="icon">⚖</span>
          <span>Researcher / Critic debate</span>
          {rounds > 0 && <span style={{marginLeft:'auto', color:'var(--ink-3)'}}>{rounds} round{rounds > 1 ? 's' : ''}</span>}
        </div>
        {debate ? debate.map((turn, i) => (
          <div key={i} className="debate-turn">
            <span className={"debate-role " + turn.role}>{turn.role}</span>
            <span className="debate-text">{turn.text}</span>
          </div>
        )) : (
          <div className="debate-turn">
            <span className={"debate-role " + (isRejected ? 'critic' : 'verdict')}>
              {isRejected ? 'critic' : 'verdict'}
            </span>
            <span className="debate-text">
              {isRejected ? (reason || '(no reason recorded)') : (rationale || '(rationale not yet available)')}
            </span>
          </div>
        )}
      </div>

      <div className="fc-meta">
        {scanner && <span><b>scanner:</b> {scanner}</span>}
        {sev && !isRejected && <span><b>severity:</b> {sev}</span>}
      </div>
    </div>
  );
}

/* ── List View ── */
function ListView({ scanner, scannerOut, events, workflowId, playState, findings, rejected, openTemporal, project, onProjectChange }) {
  const bannerCls = playState === 'running' ? 'running' : playState === 'done' ? 'completed' : 'idle';
  return (
    <div className="list-layout">
      <ConfigBar project={project} onProjectChange={onProjectChange} />
      <div className="list-body">
        <aside className="sidebar">
          <div className="sidebar-section">
            <span className="sidebar-label">Scanners</span>
            {SCANNERS.map(s => {
              const st = scanner[s.id] || 'idle';
              const out = scannerOut[s.id];
              return (
                <div key={s.id} className={"scanner-tile " + st} onClick={() => workflowId && openTemporal(workflowId)} style={{cursor: workflowId ? 'pointer' : 'default'}}>
                  <div className="scanner-tile-head">
                    <span className="scanner-tile-name">{s.label}</span>
                    <span className="scanner-tile-status">{st}</span>
                  </div>
                  <div className="scanner-tile-body">
                    {out ? Object.entries(out).map(([k,v]) => (
                      <div key={k} className="row"><span>{k}</span><b>{String(v)}</b></div>
                    )) : (
                      <span style={{fontStyle:'italic', color:'var(--ink-3)'}}>
                        {st === 'running' ? 'scanning…' : s.sub}
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="sidebar-section">
            <span className="sidebar-label">Data Sources</span>
            <div className="source-chip">
              <span className="source-chip-name">GitLab</span>
              <span className="source-chip-tag live">live API</span>
            </div>
            <div className="source-chip">
              <span className="source-chip-name">Okta</span>
              <span className="source-chip-tag mock">:9001 mock</span>
            </div>
            <div className="source-chip">
              <span className="source-chip-name">AWS IAM</span>
              <span className="source-chip-tag mock">:9002 mock</span>
            </div>
          </div>
        </aside>

        <div className="stream-area">
          {/* events */}
          <div className="stream-pane">
            <div className="wf-row">
              <div className={"wf-dot " + bannerCls}/>
              <span className="wf-label">workflow</span>
              {workflowId
                ? <a className="wf-id" style={{cursor:'pointer', color:'var(--blue)', borderBottom:'1px dotted var(--blue)'}} onClick={() => openTemporal(workflowId)}>{workflowId}</a>
                : <span className="wf-id" style={{color:'var(--ink-3)'}}>—</span>
              }
              <span className={"wf-state " + bannerCls}>{bannerCls}</span>
            </div>
            <div className="pane-head" style={{marginTop:0, borderTop:'1px solid var(--line)'}}>
              <span className="pane-title">Live Event Stream</span>
              <span className="pane-count">{events.length}</span>
            </div>
            <div className="pane-scroll">
              {events.length === 0
                ? <div className="empty-state"><span className="hint">Events will stream here during an audit.</span></div>
                : events.map(e => (
                    <div key={e.key} className="ev-row">
                      <span className="ev-ts">{e.ts}</span>
                      <span className={"ev-kind " + (e.kind || '')}>{e.label || e.kind}</span>
                      <span className="ev-msg">{e.msg}</span>
                    </div>
                  ))}
            </div>
          </div>

          {/* findings */}
          <div className="stream-pane">
            <div className="pane-head">
              <span className="pane-title">Accepted Findings</span>
              <span className="pane-count">{findings.length}</span>
            </div>
            <div className="pane-scroll">
              {findings.length === 0 && rejected.length === 0 ? (
                <div className="empty-state" style={{height:'80%'}}>
                  <div className="big">⚖</div>
                  <div className="hint">
                    Findings accepted by the Researcher/Critic loop will appear here.<br/>
                    Each one includes the full <b>debate transcript</b>.
                  </div>
                </div>
              ) : (
                <>
                  {findings.map(f => <FindingCard key={f.id || f.ID || Math.random()} f={f} isRejected={false} openTemporal={openTemporal} />)}
                  {rejected.length > 0 && (
                    <>
                      <div className="rejected-divider">Rejected by Critic ({rejected.length})</div>
                      {rejected.map((r, i) => {
                        const f = r.candidate || r.Candidate || r;
                        return <FindingCard key={i} f={f} isRejected={true}
                          reason={r.reason || r.Reason || ''}
                          convergeID={r.converge_workflow_id || r.ConvergeWorkflowID || ''}
                          openTemporal={openTemporal} />;
                      })}
                    </>
                  )}
                </>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Config Bar ── */
function ConfigBar({ project, onProjectChange }) {
  // Read the backend from window.SENTRY_CONFIG if available.
  const backend = (window.SENTRY_CONFIG && window.SENTRY_CONFIG.llm_backend) || 'gemini';
  return (
    <div className="config-bar">
      <span className="config-label">Project</span>
      <input
        className="config-input"
        value={project}
        onChange={e => onProjectChange(e.target.value)}
        placeholder="group/project  (overrides server default)"
        spellCheck={false}
      />
      <div className="config-sep"/>
      <div className="config-backend">
        <span className="dot"/>
        LLM: {backend}
      </div>
    </div>
  );
}

/* ── DAG View ── */
function DagView({ scanner, scannerOut, candidates, candsByParent, workflowId, playState,
                   accepted, rejCount, running, phaseStatus, findings, rejected,
                   openTemporal, project, onProjectChange }) {
  const W = 1400, SCAN_W = 200, SCAN_H = 58;
  const CAND_W = 108, CAND_H = 66, CGAP_X = 8, CGAP_Y = 10, CPR = 2;
  const SCAN_Y = 110, CAND_TOP = 210;

  const COL_W = (W - 80) / 5;
  const scanXs = Object.fromEntries(SCANNERS.map((s, i) => [s.id, 40 + i * COL_W]));

  function candLayout(parent) {
    const cx = scanXs[parent] + SCAN_W / 2;
    const gw = CPR * CAND_W + (CPR - 1) * CGAP_X;
    const gx = cx - gw / 2;
    return (candsByParent[parent] || []).map((c, i) => ({
      ...c, parent,
      x: gx + (i % CPR) * (CAND_W + CGAP_X),
      y: CAND_TOP + Math.floor(i / CPR) * (CAND_H + CGAP_Y),
    }));
  }

  const candNodes = useMemo(() =>
    SCANNERS.flatMap(s => candLayout(s.id)),
  [candidates]);

  const maxY = candNodes.reduce((m, n) => Math.max(m, n.y), CAND_TOP);
  const SYNTH_Y = maxY + CAND_H + 70;
  const H = SYNTH_Y + 140;

  const sevCounts = useMemo(() => {
    const out = { CRITICAL: 0, HIGH: 0, MEDIUM: 0 };
    Object.values(candidates).forEach(c => {
      if (c.status === 'accepted' && out[c.severity] !== undefined) out[c.severity]++;
    });
    return out;
  }, [candidates]);

  const [zoom, setZoom] = useState(1);
  const MIN_Z = 0.35, MAX_Z = 2.5;
  const clampZ = z => Math.max(MIN_Z, Math.min(MAX_Z, z));
  const canvasRef = useRef(null);

  useEffect(() => {
    const el = canvasRef.current;
    if (!el) return;
    const fn = e => {
      if (e.metaKey || e.ctrlKey) { e.preventDefault(); setZoom(z => clampZ(z + (e.deltaY < 0 ? .1 : -.1))); }
    };
    el.addEventListener('wheel', fn, { passive: false });
    return () => el.removeEventListener('wheel', fn);
  }, []);

  const [popover, setPopover] = useState(null);
  const [synthPop, setSynthPop] = useState(null);

  const openPop = (e, cand) => {
    e.stopPropagation();
    const r = e.target.getBoundingClientRect();
    setPopover({ cand, x: Math.max(20, Math.min(r.left, window.innerWidth - 580)), y: Math.max(20, Math.min(r.bottom + 8, window.innerHeight - 360)) });
  };
  const openSynth = (e, kind) => {
    e.stopPropagation();
    const r = e.target.getBoundingClientRect();
    setSynthPop({ kind, x: Math.max(20, Math.min(r.left, window.innerWidth - 720)), y: Math.max(20, Math.min(r.bottom + 8, window.innerHeight - 500)) });
  };

  useEffect(() => {
    if (!popover && !synthPop) return;
    const fn = e => { if (e.key === 'Escape') { setPopover(null); setSynthPop(null); } };
    document.addEventListener('keydown', fn);
    return () => document.removeEventListener('keydown', fn);
  }, [popover, synthPop]);

  function eClass(sid) {
    const s = scanner[sid];
    if (s === 'running') return 'edge-active';
    if (s === 'completed') return 'edge-done';
    if (s === 'failed') return 'edge-rej';
    return 'edge-base';
  }
  function ceClass(c) {
    if (c.status === 'running') return 'edge-active';
    if (c.status === 'accepted') return 'edge-done';
    if (c.status === 'rejected' || c.status === 'failed') return 'edge-rej';
    return 'edge-base';
  }

  const [p1, p2, p3] = phaseStatus;

  return (
    <>
      <div className="dag-toolbar">
        <div className="dag-stats">
          <div className="dag-stat"><span className="n">{SCANNERS.length}</span> scanners</div>
          <div className="dag-stat"><span className="n">{Object.keys(candidates).length}</span> candidates</div>
          <div className="dag-stat"><span className={"n ok"}>{accepted}</span> accepted</div>
          <div className="dag-stat"><span className={"n " + (rejCount > 0 ? 'bad' : '')}>{rejCount}</span> rejected</div>
          {running > 0 && <div className="dag-stat"><span className="n run">{running}</span> debating</div>}
        </div>
        <div style={{display:'flex',alignItems:'center'}}>
          <div className="dag-legend">
            <span className="sw"><span className="dot idle"/>&nbsp;idle</span>
            <span className="sw"><span className="dot running"/>&nbsp;running</span>
            <span className="sw"><span className="dot done"/>&nbsp;accepted</span>
            <span className="sw"><span className="dot rej"/>&nbsp;rejected</span>
          </div>
          <div className="dag-zoom">
            <button className="zoom-btn" onClick={() => setZoom(z => clampZ(z - .15))}>−</button>
            <span className="zoom-val">{Math.round(zoom * 100)}%</span>
            <button className="zoom-btn" onClick={() => setZoom(z => clampZ(z + .15))}>+</button>
            <button className="zoom-btn" onClick={() => setZoom(1)} style={{fontSize:'9px'}}>↺</button>
          </div>
        </div>
      </div>

      <div className="phase-bar">
        <div className={"phase-seg " + (p1 === 'active' ? 'active' : p1 === 'done' ? 'done' : '')}>
          <span className="ph-dot"/>Phase 1 — Scanner Fan-Out
        </div>
        <div className={"phase-seg " + (p2 === 'active' ? 'active' : p2 === 'done' ? 'done' : '')}>
          <span className="ph-dot"/>Phase 2 — Researcher / Critic Convergence
        </div>
        <div className={"phase-seg " + (p3 === 'done' ? 'done' : '')}>
          <span className="ph-dot"/>Phase 3 — Synthesis
        </div>
        <div className="config-sep" style={{marginLeft:'auto'}}/>
        <ConfigBar project={project} onProjectChange={onProjectChange} />
      </div>

      <div ref={canvasRef} className="dag-canvas" onDoubleClick={e => { if (!e.target.closest('.node-g,.notes-icon,.notes-icon-bg')) setZoom(1); }}>
        <div className="dag-zoom-wrap" style={{ width: W * zoom, height: H * zoom, transform: `scale(${zoom})` }}>
          <svg width={W} height={H} xmlns="http://www.w3.org/2000/svg">

            {/* root */}
            <DagNode x={(W - 300) / 2} y={20} w={300} h={70}
              cls={"root " + (playState === 'running' ? 'running' : playState === 'done' ? 'completed' : 'idle')}
              onClick={() => openTemporal(workflowId)}>
              <text x={150} y={24} textAnchor="middle" className="lbl">SecurityAuditWorkflow</text>
              <text x={150} y={41} textAnchor="middle" className="sub">{workflowId || '—'}</text>
              <text x={150} y={57} textAnchor="middle" className="badge">CLICK → TEMPORAL</text>
            </DagNode>

            {/* edges root → scanners */}
            {SCANNERS.map(s => {
              const sx = scanXs[s.id] + SCAN_W / 2;
              return <path key={'er-'+s.id} d={`M ${W/2} 90 L ${W/2} 104 L ${sx} 104 L ${sx} ${SCAN_Y}`} className={eClass(s.id)} />;
            })}

            {/* scanner nodes */}
            {SCANNERS.map(s => {
              const st = scanner[s.id] || 'idle';
              const out = scannerOut[s.id] || {};
              const sub = st === 'completed' && out.findings_count !== undefined
                ? `${out.findings_count} candidate${out.findings_count !== 1 ? 's' : ''}`
                : st === 'running' ? 'scanning…' : s.sub;
              return (
                <DagNode key={s.id} x={scanXs[s.id]} y={SCAN_Y} w={SCAN_W} h={SCAN_H}
                  cls={"scanner " + st} onClick={() => openTemporal(workflowId)}>
                  <text x={SCAN_W/2} y={18} textAnchor="middle" className="lbl" style={{fontSize:'11px'}}>{s.label}</text>
                  {s.live && <text x={SCAN_W/2} y={32} textAnchor="middle" className="sub" style={{fill:'var(--teal)',fontSize:'8px',letterSpacing:'.12em'}}>LIVE API</text>}
                  {!s.live && <text x={SCAN_W/2} y={32} textAnchor="middle" className="sub">{s.sub}</text>}
                  <text x={SCAN_W/2} y={49} textAnchor="middle" className="badge">{sub}</text>
                </DagNode>
              );
            })}

            {/* edges scanner → candidates */}
            {candNodes.map(c => {
              const fx = scanXs[c.parent] + SCAN_W / 2;
              const fy = SCAN_Y + SCAN_H;
              const tx = c.x + CAND_W / 2;
              const ty = c.y;
              const my = (fy + ty) / 2;
              return <path key={'ec-'+c.id} d={`M ${fx} ${fy} C ${fx} ${my}, ${tx} ${my}, ${tx} ${ty}`} className={ceClass(c)} />;
            })}

            {/* candidate (converge) nodes */}
            {candNodes.map(c => (
              <CandNode key={c.id} c={c} w={CAND_W} h={CAND_H}
                onTemporal={() => openTemporal(c.convergeWorkflowID)}
                onNotes={e => openPop(e, c)} />
            ))}

            {candNodes.length === 0 && (
              <text x={W/2} y={CAND_TOP + 70} textAnchor="middle" className="dag-empty">
                {playState === 'idle' ? 'Click "Run Audit" to begin — findings will animate here in real time.' : 'Waiting for scanner candidates…'}
              </text>
            )}

            {/* edges candidates → synthesis */}
            {candNodes.map(c => {
              if (c.status === 'idle' || c.status === 'running') return null;
              const tx = c.status === 'accepted' ? W/2 - 140 : W/2 + 140;
              return <path key={'es-'+c.id} d={`M ${c.x+CAND_W/2} ${c.y+CAND_H} L ${c.x+CAND_W/2} ${SYNTH_Y-28} L ${tx} ${SYNTH_Y-28} L ${tx} ${SYNTH_Y}`} className={ceClass(c)} />;
            })}

            {/* synthesis tiles */}
            <SynthTile kind="accept" x={W/2-270} y={SYNTH_Y} w={260} h={100}
              count={accepted} sevCounts={sevCounts}
              onClick={() => openTemporal(workflowId)}
              onNotes={e => accepted > 0 && openSynth(e, 'accepted')}
            />
            <SynthTile kind="reject" x={W/2+10} y={SYNTH_Y} w={260} h={100}
              count={rejCount}
              onClick={() => openTemporal(workflowId)}
              onNotes={e => rejCount > 0 && openSynth(e, 'rejected')}
            />
          </svg>
        </div>

        {popover && <CandPopover p={popover} onClose={() => setPopover(null)} openTemporal={openTemporal} />}
        {synthPop && <SynthPopover p={synthPop} onClose={() => setSynthPop(null)}
          items={synthPop.kind === 'accepted' ? findings : rejected}
          kind={synthPop.kind} openTemporal={openTemporal} />}
      </div>
    </>
  );
}

function DagNode({ x, y, w, h, cls, onClick, children }) {
  return (
    <g className={"node-g " + cls} transform={`translate(${x},${y})`} onClick={onClick}>
      <rect width={w} height={h} rx={2}/>
      <rect className="node-pulse" x={-2} y={-2} width={w+4} height={h+4} rx={4}/>
      {children}
    </g>
  );
}

function CandNode({ c, w, h, onTemporal, onNotes }) {
  const hasNotes = !!(c.rationale || c.reason || c.status === 'accepted' || c.status === 'rejected');
  return (
    <g className={"node-g converge " + c.status} transform={`translate(${c.x},${c.y})`} onClick={onTemporal}>
      <rect width={w} height={h} rx={2}/>
      <rect className="node-pulse" x={-2} y={-2} width={w+4} height={h+4} rx={4}/>
      <text x={w/2} y={17} textAnchor="middle" className="lbl" style={{fontSize:'9px',pointerEvents:'none'}}>
        {c.id.length > 20 ? c.id.slice(0,18)+'..' : c.id}
      </text>
      {c.severity && <text x={w/2} y={33} textAnchor="middle" className={"sev-label " + c.severity} style={{pointerEvents:'none'}}>{c.severity}</text>}
      <text x={w/2} y={51} textAnchor="middle" className="badge" style={{fontSize:'8px',pointerEvents:'none'}}>
        {c.status === 'accepted' ? `ACCEPTED·${c.rounds||1}R`
          : c.status === 'rejected' ? `REJECTED`
          : c.status === 'running' ? 'DEBATING…' : 'PENDING'}
      </text>
      {hasNotes && (
        <g onClick={e => { e.stopPropagation(); onNotes(e); }}>
          <circle cx={w-10} cy={10} r={8} className="notes-icon-bg"/>
          <text x={w-10} y={13.5} textAnchor="middle" className="notes-icon" style={{fontSize:'10px',fontWeight:'700',pointerEvents:'none',userSelect:'none'}}>i</text>
          <rect x={w-20} y={0} width={20} height={20} fill="transparent"/>
        </g>
      )}
    </g>
  );
}

function SynthTile({ kind, x, y, w, h, count, sevCounts, onClick, onNotes }) {
  const isAccept = kind === 'accept';
  const empty = count === 0;
  return (
    <g className={"node-g " + (isAccept ? 'synth-accept' : 'synth-reject')} transform={`translate(${x},${y})`} onClick={onClick} style={{cursor:'pointer'}}>
      <rect width={w} height={h} rx={2}/>
      <text x={w/2} y={20} textAnchor="middle" style={{fill: isAccept ? 'var(--teal)' : 'var(--ink-3)', fontSize:'9px',letterSpacing:'.15em',textTransform:'uppercase',fontWeight:'700',fontFamily:'IBM Plex Mono',pointerEvents:'none'}}>
        {isAccept ? 'Accepted Findings' : 'Rejected by Critic'}
      </text>
      <text x={w/2} y={52} textAnchor="middle" style={{fill: isAccept ? 'var(--teal)' : 'var(--ink-3)', fontSize:'28px',fontFamily:'IBM Plex Sans',fontWeight:'600',pointerEvents:'none'}}>{count}</text>
      {isAccept && !empty && sevCounts && (
        <g transform={`translate(${w/2}, 75)`}>
          {Object.entries(sevCounts).filter(([,n]) => n > 0).map(([sev, n], i, arr) => {
            const xo = -((arr.length - 1) * 60) / 2 + i * 60;
            const fill = sev === 'CRITICAL' ? 'var(--red)' : sev === 'HIGH' ? 'var(--gl)' : 'var(--yellow)';
            return <g key={sev} transform={`translate(${xo},0)`}>
              <text x={0} y={0} textAnchor="middle" style={{fill,fontSize:'8px',fontWeight:'700',letterSpacing:'.1em',fontFamily:'IBM Plex Mono',pointerEvents:'none'}}>{sev}</text>
              <text x={0} y={14} textAnchor="middle" style={{fill:'var(--ink-3)',fontSize:'9px',fontFamily:'IBM Plex Mono',pointerEvents:'none'}}>{n}</text>
            </g>;
          })}
        </g>
      )}
      {!empty && (
        <g onClick={e => { e.stopPropagation(); onNotes(e); }}>
          <circle cx={w-12} cy={12} r={9} className="notes-icon-bg"/>
          <text x={w-12} y={15.5} textAnchor="middle" className="notes-icon" style={{fontSize:'11px',fontWeight:'700',pointerEvents:'none',userSelect:'none'}}>i</text>
          <rect x={w-24} y={0} width={24} height={24} fill="transparent"/>
        </g>
      )}
    </g>
  );
}

function CandPopover({ p, onClose, openTemporal }) {
  const c = p.cand;
  const raw = { candidate_id: c.id, status: c.status, severity: c.severity, rounds: c.rounds, converge_workflow_id: c.convergeWorkflowID, rationale: c.rationale, rejection_reason: c.reason };
  const clean = Object.fromEntries(Object.entries(raw).filter(([,v]) => v !== null && v !== undefined && v !== ''));
  const debate = parseRationale(c.rationale || c.reason || '');
  return (
    <>
      <div className="pop-overlay" onClick={onClose}/>
      <div className="popover" style={{left: p.x, top: p.y}}>
        <div className="pop-head">
          <span className="pop-title">{c.label || c.id}</span>
          <button className="pop-close" onClick={onClose}>×</button>
        </div>
        <div className="pop-body">
          <div className="pop-field">
            <span className="pop-field-label">status</span>
            <span className={"pop-field-val " + (c.severity ? 'sev-'+c.severity : '')}>
              {c.status}{c.severity ? ' · ' + c.severity : ''}{c.rounds > 0 ? ` · ${c.rounds}R` : ''}
            </span>
          </div>
          {c.description && (
            <div className="pop-field">
              <span className="pop-field-label">description</span>
              <span className="pop-field-val">{c.description}</span>
            </div>
          )}
          {/* Debate transcript */}
          {debate ? (
            <div className="pop-field">
              <span className="pop-field-label">Researcher / Critic Debate</span>
              <div style={{border:'1px solid var(--line-2)', background:'var(--bg)'}}>
                {debate.map((turn, i) => (
                  <div key={i} className="debate-turn">
                    <span className={"debate-role " + turn.role}>{turn.role}</span>
                    <span className="debate-text">{turn.text}</span>
                  </div>
                ))}
              </div>
            </div>
          ) : (c.rationale || c.reason) && (
            <div className="pop-field">
              <span className="pop-field-label">{c.status === 'rejected' ? 'Critic rejection' : 'Critic rationale'}</span>
              <span className={"pop-field-val " + (c.status === 'rejected' ? 'reason' : 'critic')}>
                {c.rationale || c.reason}
              </span>
            </div>
          )}
          <details>
            <summary>raw event payload (JSON)</summary>
            <div className="pop-field-val json" style={{marginTop:'6px'}}>{JSON.stringify(clean, null, 2)}</div>
          </details>
        </div>
        {c.convergeWorkflowID && (
          <div className="pop-foot">
            <a className="tmp-btn" onClick={() => openTemporal(c.convergeWorkflowID)}>Open in Temporal →</a>
          </div>
        )}
      </div>
    </>
  );
}

function SynthPopover({ p, onClose, items, kind, openTemporal }) {
  const isRej = kind === 'rejected';
  return (
    <>
      <div className="pop-overlay" onClick={onClose}/>
      <div className="popover wide" style={{left: p.x, top: p.y}}>
        <div className="pop-head">
          <span className="pop-title">{isRej ? `Rejected by Critic (${items.length})` : `Accepted Findings (${items.length})`}</span>
          <button className="pop-close" onClick={onClose}>×</button>
        </div>
        <div className="pop-body">
          {items.length === 0 ? (
            <span className="pop-field-val" style={{fontStyle:'italic',color:'var(--ink-3)'}}>None.</span>
          ) : (
            <div className="synth-list">
              {items.map((item, i) => {
                const f = isRej ? (item.candidate || item.Candidate || item) : item;
                const sev = f.severity || f.Severity || 'INFO';
                const title = f.title || f.Title || '(no title)';
                const desc = f.description || f.Description || '';
                const rationale = f.llm_rationale || f.LLMRationale || '';
                const reason = isRej ? (item.reason || item.Reason || '') : '';
                const cwfid = (isRej ? (item.converge_workflow_id || item.ConvergeWorkflowID) : (f.converge_workflow_id || f.ConvergeWorkflowID)) || '';
                const rounds = f.converge_rounds || f.ConvergeRounds || 0;
                const scanner = f.scanner_id || f.ScannerID || '';
                const debate = parseRationale(rationale || reason || '');
                return (
                  <div key={f.id || i} className={"synth-item " + (isRej ? 'rejected' : 'sev-'+sev)}>
                    <div className="synth-item-head">
                      <span className="synth-item-title">{title}</span>
                      <span className={"fc-sev " + (isRej ? 'REJECTED' : sev)}>{isRej ? 'REJECTED' : sev}</span>
                    </div>
                    {desc && <div className="synth-item-body">{desc}</div>}
                    <div className="synth-item-debate">
                      {debate ? (
                        <div style={{border:'1px solid var(--line)',background:'var(--bg)'}}>
                          {debate.slice(0, 3).map((t, j) => (
                            <div key={j} className="debate-turn">
                              <span className={"debate-role " + t.role}>{t.role}</span>
                              <span className="debate-text" style={{maxHeight:'60px',overflow:'hidden',display:'block'}}>{t.text}</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className={"pop-field-val " + (isRej ? 'reason' : 'critic')} style={{maxHeight:'80px',overflow:'hidden'}}>
                          {isRej ? (reason || '(no reason)') : (rationale || '(no rationale)')}
                        </div>
                      )}
                    </div>
                    <div className="synth-item-foot">
                      <span className="synth-item-meta">
                        {scanner && <span><b>scanner:</b> {scanner}</span>}
                        {rounds > 0 && <span><b>rounds:</b> {rounds}</span>}
                      </span>
                      {cwfid && <a className="tmp-btn" onClick={() => openTemporal(cwfid)}>TMP →</a>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
