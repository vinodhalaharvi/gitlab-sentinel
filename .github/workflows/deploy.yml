name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for Workload Identity Federation

env:
  PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT }}
  REGION: us-central1
  SERVICE: gitlab-sentinel
  IMAGE: gcr.io/${{ vars.GOOGLE_CLOUD_PROJECT }}/gitlab-sentinel

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: vars.GOOGLE_CLOUD_PROJECT != ''

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        run: docker push --all-tags ${{ env.IMAGE }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300 \
            --set-env-vars="LLM_BACKEND=gemini" \
            --update-secrets="GITLAB_TOKEN=gitlab-token:latest" \
            --update-secrets="GITLAB_PROJECT=gitlab-project:latest" \
            --update-secrets="GOOGLE_API_KEY=google-api-key:latest"

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "✅ Live at: $URL"
          echo "service_url=$URL" >> $GITHUB_OUTPUT
