name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go vet -tags sibyl_stub ./...

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod tidy

  build:
    name: build (${{ matrix.tags || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tags: ["", "sibyl_stub"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            go build -tags "${{ matrix.tags }}" ./...
          else
            go build ./...
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test (race)
        run: go test -race -timeout=5m ./...
        env:
          GITLAB_TOKEN: ""
          GITLAB_PROJECT: ""
      - name: go test (sibyl_stub)
        run: go test -tags sibyl_stub -timeout=5m ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6.5.0
        with:
          version: v1.64.8
          args: --timeout=5m


  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [vet, fmt, tidy, build, test, coverage, staticcheck, lint]
    if: always()
    steps:
      - name: All required checks passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          failed = [k for k, v in needs.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('FAILED jobs:', failed)
              sys.exit(1)
          print('All CI checks passed.')
          "
