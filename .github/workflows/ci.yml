name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  # ── 1. go vet ─────────────────────────────────────────────────────────────
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go vet -tags sibyl_stub ./...

  # ── 2. gofmt ──────────────────────────────────────────────────────────────
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  # ── 3. go mod tidy ────────────────────────────────────────────────────────
  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod tidy
      - name: Check dirty go.mod / go.sum
        run: |
          if ! git diff --exit-code go.mod go.sum; then
            echo "Run 'go mod tidy' and commit the result."
            exit 1
          fi

  # ── 4. build ──────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tags: ["", "sibyl_stub"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build (tags=${{ matrix.tags }})
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            go build -tags "${{ matrix.tags }}" ./...
          else
            go build ./...
          fi

  # ── 5. test ───────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test (race detector)
        run: go test -race -timeout=5m ./...
        env:
          GITLAB_TOKEN: ""
          GITLAB_PROJECT: ""
      - name: go test (sibyl_stub)
        run: go test -tags sibyl_stub -timeout=5m ./...

  # ── 6. coverage ───────────────────────────────────────────────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Generate coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ── 7. staticcheck ────────────────────────────────────────────────────────
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  # ── 8. golangci-lint ──────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ── 9. govulncheck ────────────────────────────────────────────────────────
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # ── gate ──────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [vet, fmt, tidy, build, test, coverage, staticcheck, lint, vuln]
    if: always()
    steps:
      - name: All jobs passed
        run: |
          python3 -c "
          import json, sys
          needs = json.loads('${{ toJSON(needs) }}')
          failed = [k for k, v in needs.items() if v['result'] not in ('success','skipped')]
          if failed:
              print('FAILED:', failed); sys.exit(1)
          print('All CI checks passed.')
          "
